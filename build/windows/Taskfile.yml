version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: 构建 Windows 可执行文件
    cmds:
      - task: common:build:frontend
        vars:
          BUILD_FLAGS: '{{.BUILD_FLAGS}}'
          DEV: '{{.DEV}}'
      - task: generate:syso
        vars:
          ARCH: '{{.ARCH}}'
      - defer: powershell -NoProfile -Command "Remove-Item -LiteralPath wails_windows_{{.ARCH}}.syso -Force -ErrorAction SilentlyContinue"
      - go build {{.BUILD_FLAGS}} -o "{{.BIN_DIR}}/{{.APP_NAME}}.exe"
    vars:
      ARCH: '{{.ARCH | default ARCH}}'
      BUILD_FLAGS: '{{if eq .DEV "true"}}-buildvcs=false -gcflags=all="-l"{{else}}-tags production -trimpath -buildvcs=false -ldflags="-w -s -H windowsgui"{{end}}'
    env:
      GOOS: windows
      GOARCH: '{{.ARCH}}'
      CGO_ENABLED: '0'

  generate:syso:
    internal: true
    dir: build
    cmds:
      - wails3 generate syso -arch {{.ARCH}} -icon windows/icon.ico -manifest windows/wails.exe.manifest -info windows/info.json -out ../wails_windows_{{.ARCH}}.syso
